name: Sync upstream skills
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy upstream folder
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/asgeirtj/system_prompts_leaks.git /tmp/up
          git -C /tmp/up sparse-checkout set Anthropic/claude-design
          rm -rf plugins/cdesign
          mkdir -p plugins
          cp -r /tmp/up/Anthropic/claude-design plugins/cdesign
          mkdir -p plugins/cdesign/.claude-plugin
          echo '{"name":"cdesign","description":"Claude Design skills synced from asgeirtj/system_prompts_leaks"}' > plugins/cdesign/.claude-plugin/plugin.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A plugins
          git diff --cached --quiet || git commit -m "Sync claude-design skills from upstream"
          git push
